galaxy_info:
  author: Christian Rodriguez
  description: Configure one or more users as sudoers with Mikroways pub keys
  company: Mikroways
  role_name: mw_user # if absent directory name hosting role is used instead
  namespace: mikroways

  license: GPL-2.0-or-later

  min_ansible_version: "2.19"

  platforms:
    - name: Ubuntu
      versions:
        - focal
        - bionic
    - name: Debian
      versions:
        - buster

  galaxy_tags:
    - users
    - ssh
    - sudo
    - authorized_keys
    - mikroways

dependencies:
  - role: grog.management-user
    version: v1.3.3
    management_user_list: []
    management_user_list_host: []
    management_user_list_group: []
  - role: GROG.package
    version: v1.4.1
