# defaults/main.yml
---
add_mw_accounts: true
mw_user_create_one_account_per_user: false
mw_user_name: mikroways
mw_user_url: https://mikroways.gitlab.io/public/ssh_keys/_users
mw_user_key_url: https://mikroways.gitlab.io/public/ssh_keys/%user%.pub
mw_user_enabled_users: []
mw_user_template:
  shell: '/bin/bash'
  sudo:
    hosts: ALL
    as: ALL
    commands: ALL
    nopasswd: yes
mw_user_extra_accounts: []
mw_users_to_remove: []

mw_user_add_client_accounts: false
mw_user_customer_admin_name: admin
mw_user_customer_create_one_account_per_user: false
mw_user_customer_template:
  shell: '/bin/bash'
  sudo:
    hosts: ALL
    as: ALL
    commands: ALL
    nopasswd: yes
mw_user_customer_users: []
