---
name: Tests
on:
  pull_request:
    branches:
      - main

jobs:
  molecule:
    name: Molecule test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run molecule
        run: uv run molecule test --all
